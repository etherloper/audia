[package]
name = "audia"
version = "0.1.0"
description = "An offline audiobook player for your own library"
authors = ["etherloper"]
license = "MIT"
repository = "https://github.com/etherloper/audia"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
lofty = "0.22.2"
walkdir = "2.5.0"
base64 = "0.22.1"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-dialog = "2.6.0"
notify-debouncer-mini = "0.6"
tauri-plugin-single-instance = "2"
# Pure-Rust D-Bus on Linux (no libdbus needed to build)
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.2"
