# Builds the Windows installers and the signed update files, and puts them in a
# draft GitHub release. Runs when a version tag such as v0.2.0 is pushed; the tag
# must match "version" in src-tauri/tauri.conf.json. Review the draft, then
# publish it: the app only sees published releases as updates.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the private key from `bunx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and tests
        run: |
          bun run check
          bun run test
          cd src-tauri
          cargo test

      - name: Build and create the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Audia ${{ github.ref_name }}
          releaseBody: |
            Download **Audia_*_x64-setup.exe** below and run it. If Audia is already installed it updates in place, and your library and settings are kept.

            Windows may show a SmartScreen warning because the installer isn't code-signed yet: choose **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
