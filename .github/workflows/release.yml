# Builds Audia for Windows, macOS (Apple Silicon and Intel) and Linux, with the
# signed update files, and puts them all in one draft GitHub release.
#
# - Pushing a version tag such as v0.2.0 makes a release. The tag must match
#   "version" in src-tauri/tauri.conf.json. Review the draft, then publish it:
#   the app only sees published releases as updates.
# - Running the workflow by hand (Actions → Release → Run workflow) is a dry run:
#   it builds every platform without creating a release.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the private key from `bun tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Checks the code once, then creates the draft release that every platform's
  # build uploads into. (Letting each build create it can make several drafts.)
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and tests
        run: |
          bun run check
          bun run test

      - name: Create the draft release
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The API returns the new release's id directly; listing releases straight
        # after creating one can miss it
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Audia $GITHUB_REF_NAME" \
            -F body=@.github/release-notes.md \
            -F draft=true \
            --jq .id)
          if [ -z "$id" ]; then
            echo "::error::Couldn't create the draft release"
            exit 1
          fi
          echo "Created draft release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check the draft release was created
        if: github.event_name == 'push' && needs.create-release.outputs.release_id == ''
        run: |
          echo "::error::No draft release id from the create-release job"
          exit 1

      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
          # Empty on a dry run, so the action only builds
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
